name: Repository Security Audit

on:
  push:
    paths:
      - "**"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run dependency-free secret and workflow audit
        run: python3 scripts/security_audit.py
