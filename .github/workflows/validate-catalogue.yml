name: Validate API Catalogue

on:
  schedule:
    - cron: "17 7 * * 1"
  push:
    paths:
      - "data.json"
      - "scripts/validate_data.py"
      - "scripts/generate-readme.js"
      - "README.md"
      - ".github/workflows/validate-catalogue.yml"
  pull_request:
    paths:
      - "data.json"
      - "scripts/validate_data.py"
      - ".github/workflows/validate-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JSON catalogue structure
        run: python3 scripts/validate_data.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Verify generated README matches catalogue
        run: |
          node scripts/generate-readme.js
          git diff --exit-code -- README.md
