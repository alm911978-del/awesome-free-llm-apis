name: Validate API Catalogue

on:
  push:
    paths:
      - "data.json"
      - "scripts/validate_data.py"
      - ".github/workflows/validate-catalogue.yml"
  pull_request:
    paths:
      - "data.json"
      - "scripts/validate_data.py"
      - ".github/workflows/validate-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JSON catalogue structure
        run: python3 scripts/validate_data.py
